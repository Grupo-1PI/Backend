spring.application.name=clinica-acupuntura-test

# Um banco H2 em memoria unico por contexto de teste, para nao colidir schema.sql entre testes
spring.datasource.url=jdbc:h2:mem:clinica_${random.uuid};MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Mantem logs mais limpos nos testes
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (mantem defaults dos testes sem depender de variavel de ambiente)
jwt.validity=3600
jwt.
