spring.application.name=clinica-acupuntura

# BANCO H2
spring.datasource.url=jdbc:h2:mem:clinica
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# executar schema.sql e data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# erros
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param

# =============================================================================
# CONFIGURAÇÕES JWT
# =============================================================================

# Tempo de validade do token em SEGUNDOS
# 3600 = 1 hora | 86400 = 24 horas | 604800 = 7 dias
# Em produção: tokens de curta duração (15-60 min) + refresh token são mais seguros
jwt.validity=${JWT_VALIDITY:3600}

# Chave secreta para assinar os tokens (algoritmo HMAC-SHA256)
# REQUISITOS:
#   - Deve estar codificada em Base64
#   - Mínimo de 32 bytes após decodificação (256 bits para HS256)
# ATENÇÃO:
#   - NUNCA use esta chave em produção
#   - Em produção, defina a variável de ambiente JWT_SECRET com uma chave forte
#   - Nunca commite chaves reais no repositório Git
jwt.secret=${JWT_SECRET:}

# Swagger
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs
