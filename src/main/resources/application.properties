spring.application.name=clinica-acupuntura

# BANCO H2
spring.datasource.url=jdbc:h2:mem:clinica
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# executar schema.sql e data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# erros
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param

# Swagger
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs