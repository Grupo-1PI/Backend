spring.application.name=${SPRING_APPLICATION_NAME:clinica-acupuntura}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET}

security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs