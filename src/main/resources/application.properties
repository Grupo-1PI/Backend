spring.application.name=clinica-acupuntura
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/taotenshin
spring.datasource.username=root
spring.datasource.password=E21s20@1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# NAO executar schema.sql e data.sql
spring.sql.init.mode=never

# logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# ERROS
# =============================================================================

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=on_param

# =============================================================================
# CONFIGURACOES JWT
# =============================================================================

# Tempo de validade do token em SEGUNDOS
# 3600 = 1 hora | 86400 = 24 horas | 604800 = 7 dias
# Em producao: tokens de curta duracao (15-60 min) + refresh token sao mais seguros
jwt.validity=${JWT_VALIDITY:3600}

# Chave secreta JWT
jwt.secret=${JWT_SECRET:}

# =============================================================================
# SWAGGER
# =============================================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs